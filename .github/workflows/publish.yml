
name: Update SIA

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Restore the latest saved fundamentals from earlier successful runs.
      # Each run has a unique key because GitHub Actions caches are immutable.
      - name: Restore fundamentals cache
        uses: actions/cache/restore@v4
        with:
          path: fundamentals-cache.json
          key: sia-fundamentals-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sia-fundamentals-${{ github.ref_name }}-

      - run: python generate.py

      - name: Prepare fundamentals cache for next run
        run: cp site/fundamentals-cache.json fundamentals-cache.json

      - name: Save fundamentals cache
        uses: actions/cache/save@v4
        with:
          path: fundamentals-cache.json
          key: sia-fundamentals-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        with:
          name: sia-test-result
          path: |
            site/index.html
            site/fundamentals-cache.json
            site/recommendations.csv
            site/composite-recommendations.csv


